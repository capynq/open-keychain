name: Release self-hosted beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: ghcr.io/capynq/open-keychain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve and validate the release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "series=${VERSION%.*}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm bench:matrix
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --workers=1
      - name: Build and start the self-hosted image
        id: self_hosted_up
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Validate the deployed self-hosted image
        id: self_hosted_validation
        run: pnpm validate:self-hosted
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          SELF_HOSTED_BASE_URL: http://127.0.0.1:8080
      - name: Show self-hosted logs on failure
        if: ${{ always() && (steps.self_hosted_up.outcome == 'failure' || steps.self_hosted_validation.outcome == 'failure') }}
        run: docker compose logs --no-color
      - name: Stop the self-hosted image
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
      - name: Package the portable static build
        run: |
          mkdir -p release
          cp -R dist "release/open-keychain-${GITHUB_REF_NAME}"
          cd release
          zip -qr "open-keychain-${GITHUB_REF_NAME}-dist.zip" "open-keychain-${GITHUB_REF_NAME}"
          sha256sum "open-keychain-${GITHUB_REF_NAME}-dist.zip" > SHA256SUMS
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.series }}
            type=raw,value=beta
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Create the draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --prerelease \
            --latest=false \
            --verify-tag \
            --title "Open Keychain $GITHUB_REF_NAME" \
            --generate-notes \
            "release/open-keychain-${GITHUB_REF_NAME}-dist.zip" \
            release/SHA256SUMS
