name: Release self-hosted beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/capynq/open-keychain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve and validate the release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "series=${VERSION%.*}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm bench:matrix
        if: startsWith(github.ref, 'refs/tags/')
      - run: pnpm exec playwright install chromium
      - name: Run browser tests against the existing build
        run: pnpm test:e2e --workers=1
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
      - name: Build and start the self-hosted image
        id: self_hosted_up
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Validate the deployed self-hosted image
        id: self_hosted_validation
        run: pnpm validate:self-hosted
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          SELF_HOSTED_BASE_URL: http://127.0.0.1:8080
      - name: Show self-hosted logs on failure
        if: ${{ always() && (steps.self_hosted_up.outcome == 'failure' || steps.self_hosted_validation.outcome == 'failure') }}
        run: docker compose logs --no-color
      - name: Stop the self-hosted image
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
      - name: Package the portable static build
        run: |
          mkdir -p release
          cp -R dist "release/open-keychain-${GITHUB_REF_NAME}"
          cd release
          zip -qr "open-keychain-${GITHUB_REF_NAME}-dist.zip" "open-keychain-${GITHUB_REF_NAME}"
          sha256sum "open-keychain-${GITHUB_REF_NAME}-dist.zip" > SHA256SUMS
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: startsWith(github.ref, 'refs/tags/')
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: startsWith(github.ref, 'refs/tags/')
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        if: startsWith(github.ref, 'refs/tags/')
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.series }}
            type=raw,value=beta
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: image
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Create the draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --prerelease \
            --latest=false \
            --verify-tag \
            --title "Open Keychain $GITHUB_REF_NAME" \
            --generate-notes \
            "release/open-keychain-${GITHUB_REF_NAME}-dist.zip" \
            release/SHA256SUMS
