name: Hosted E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/app/**'
      - 'src/features/hosted/**'
      - 'src/features/export/**'
      - 'src/pages/profile/**'
      - 'src/shared/lib/create-path.ts'
      - 'e2e/hosted-*.spec.ts'
      - 'playwright.hosted.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_keychain_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d open_keychain_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run hosted auth and export flow
        run: pnpm test:e2e:hosted --project=desktop
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/open_keychain_e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: hosted-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
