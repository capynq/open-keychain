name: PrusaSlicer validation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRUSASLICER_VERSION: 2.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install PrusaSlicer
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/prusa3d/PrusaSlicer/releases/download/version_${PRUSASLICER_VERSION}/PrusaSlicer-${PRUSASLICER_VERSION}+linux-x64-GTK3-ubuntu-20.04.AppImage" \
            --output /tmp/prusa-slicer.AppImage
          chmod +x /tmp/prusa-slicer.AppImage
          /tmp/prusa-slicer.AppImage --appimage-extract >/dev/null
          echo "PRUSASLICER_BIN=$PWD/squashfs-root/usr/bin/prusa-slicer" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validation:fixtures
      - run: pnpm validate:slicer
      - name: Upload slicer validation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: prusaslicer-validation
          path: artifacts/release/*/slicer-validation/result.json
          if-no-files-found: error
