name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Classify checkout changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/validation/commands/validation-ci-changes.mjs
        env:
          VALIDATION_BASE_SHA: ${{ github.event.before }}
      - name: Install Chromium for selected Browser coverage
        if: steps.changes.outputs.needs_browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run selected checks
        if: github.event_name != 'workflow_dispatch'
        run: pnpm validate:ci:changed
        env:
          CHANGED_FILES_JSON: ${{ steps.changes.outputs.changed_files }}
          VALIDATION_CONCURRENCY: 1
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
      - name: Install Chromium for manual full validation
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run full hosted validation
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm validate:ci
          pnpm validate:ci:browser
          pnpm validate:ci:geometry
        env:
          VALIDATION_CONCURRENCY: 1
          MATRIX_CONCURRENCY: 1
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'

  production-build:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production artifact
        run: pnpm --package=netlify-cli dlx netlify build --context production
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [quality, production-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: netlify-production
      cancel-in-progress: true
    steps:
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Deploy production build
        run: pnpm --package=netlify-cli dlx netlify deploy --prod --no-build --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
