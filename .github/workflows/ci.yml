name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm bench:matrix
      - run: pnpm build
      - name: Validate local Compose configuration
        run: docker compose -f docker-compose.yml config
      - name: Validate hosted Compose configuration
        run: docker compose --env-file .env.hosted.example -f docker-compose.hosted.yml config
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.sha }}"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --workers=1
      - name: Build and start the self-hosted image
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Validate the deployed self-hosted image
        run: pnpm validate:self-hosted
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          SELF_HOSTED_BASE_URL: http://127.0.0.1:8080
      - name: Show self-hosted logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the self-hosted image
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
