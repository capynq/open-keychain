name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      needs_browser: ${{ steps.changes.outputs.needs_browser }}
      needs_geometry: ${{ steps.changes.outputs.needs_geometry }}
      conservative: ${{ steps.changes.outputs.conservative }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Classify checkout changes
        id: changes
        run: node scripts/validation/commands/validation-ci-changes.mjs
        env:
          VALIDATION_BASE_SHA: ${{ github.event.before }}

  validate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full format, lint, typecheck, unit and build checks
        run: pnpm validate:ci
        env:
          VALIDATION_CONCURRENCY: 2
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
      - name: Upload validation build for full browser coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: validation-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: [plan, validate]
    if: needs.plan.outputs.needs_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-dist
          path: dist
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full public browser and hosted workspace coverage
        run: pnpm validate:ci:browser
        env:
          VALIDATION_CONCURRENCY: 2
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0

  geometry:
    needs: plan
    if: needs.plan.outputs.needs_geometry == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full geometry and export matrix
        run: pnpm validate:ci:geometry
        env:
          VALIDATION_CONCURRENCY: 4
          MATRIX_CONCURRENCY: 4
          MATRIX_SHARD_INDEX: ${{ matrix.shard }}
          MATRIX_SHARD_COUNT: 8
          MATRIX_SUMMARY_FILE: artifacts/geometry-summary/shard-${{ matrix.shard }}.json
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0

      - name: Upload geometry shard summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: geometry-summary-${{ matrix.shard }}
          path: artifacts/geometry-summary/shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  geometry-aggregate:
    if: always() && needs.plan.outputs.needs_geometry == 'true'
    needs: [plan, geometry]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: geometry-summary-*
          merge-multiple: true
          path: artifacts/geometry-summary
      - name: Enforce complete matrix coverage and five-minute target
        run: pnpm validate:matrix:shards artifacts/geometry-summary

  required-checks:
    if: always()
    needs: [plan, validate, browser, geometry-aggregate]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required checks
        env:
          PLAN: ${{ needs.plan.result }}
          VALIDATE: ${{ needs.validate.result }}
          NEED_BROWSER: ${{ needs.plan.outputs.needs_browser }}
          BROWSER: ${{ needs.browser.result }}
          NEED_GEOMETRY: ${{ needs.plan.outputs.needs_geometry }}
          GEOMETRY: ${{ needs.geometry-aggregate.result }}
        run: |
          set -eu
          echo "validate: $VALIDATE"
          test "$PLAN" = success
          test "$VALIDATE" = success
          if [ "$NEED_BROWSER" = true ]; then
            echo "browser: $BROWSER (required)"
            test "$BROWSER" = success
          else
            echo "browser: not required"
          fi
          if [ "$NEED_GEOMETRY" = true ]; then
            echo "geometry: $GEOMETRY (required)"
            test "$GEOMETRY" = success
          else
            echo "geometry: not required"
          fi

  production-build:
    needs: required-checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production artifact
        run: pnpm --package=netlify-cli dlx netlify build --context production
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [required-checks, production-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: netlify-production
      cancel-in-progress: true
    steps:
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Deploy production build
        run: pnpm --package=netlify-cli dlx netlify deploy --prod --no-build --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
