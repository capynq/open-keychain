name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merged_pr: ${{ steps.merge.outputs.merged_pr }}
      changed_files: ${{ steps.changes.outputs.changed_files }}
      needs_static: ${{ steps.changes.outputs.needs_static }}
      needs_unit: ${{ steps.changes.outputs.needs_unit }}
      needs_browser: ${{ steps.changes.outputs.needs_browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Classify checkout changes
        id: changes
        run: node scripts/validation/commands/validation-ci-changes.mjs
        env:
          VALIDATION_BASE_SHA: ${{ github.event.before }}
      # A merged pull request already passed its browser checks; a direct push to main has not.
      - name: Detect a merged pull request
        id: merge
        if: github.event_name == 'push'
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\")] | length" || echo 0)"
          echo "merged_pr=$([ "${count:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  static:
    name: Format, lint and typecheck
    needs: changes
    if: needs.changes.outputs.needs_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run selected static checks
        run: pnpm validate:ci:changed
        env:
          CHANGED_FILES_JSON: ${{ needs.changes.outputs.changed_files }}
          VALIDATION_GATE_GROUP: static
          VALIDATION_CONCURRENCY: 3
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
      - name: Upload validation logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: validation-logs-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation-logs/
          if-no-files-found: warn
          retention-days: 7

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.needs_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run selected unit tests
        run: pnpm validate:ci:changed
        env:
          CHANGED_FILES_JSON: ${{ needs.changes.outputs.changed_files }}
          VALIDATION_GATE_GROUP: unit
          VALIDATION_CONCURRENCY: 4
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
      - name: Upload validation logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: validation-logs-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation-logs/
          if-no-files-found: warn
          retention-days: 7

  # Merges skip this job: the pull request ran it, and production-build reruns the critical journey.
  browser:
    name: Build and browser tests
    needs: changes
    if: needs.changes.outputs.needs_browser == 'true' && needs.changes.outputs.merged_pr != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      - name: Run selected browser checks
        run: pnpm validate:ci:changed
        env:
          CHANGED_FILES_JSON: ${{ needs.changes.outputs.changed_files }}
          VALIDATION_GATE_GROUP: browser
          VALIDATION_CONCURRENCY: 2
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
      - name: Upload validation logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: validation-logs-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation-logs/
          if-no-files-found: warn
          retention-days: 7

  full:
    name: Full hosted validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      - name: Run full hosted validation
        run: |
          pnpm validate:ci
          pnpm validate:ci:browser
          pnpm validate:ci:geometry
        env:
          VALIDATION_CONCURRENCY: 1
          MATRIX_CONCURRENCY: 1
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
      - name: Upload validation logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: validation-logs-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/validation-logs/
          if-no-files-found: warn
          retention-days: 7

  # The required status: passes only when every selected job passed; unselected jobs are skipped.
  quality:
    needs: [changes, static, unit, browser, full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected job to pass
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped") and any(.value.result == "success")' >/dev/null
        env:
          RESULTS: ${{ toJSON(needs) }}

  production-build:
    needs: quality
    if: ${{ !cancelled() && needs.quality.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Build production artifact
        run: pnpm --package=netlify-cli dlx netlify build --context production
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VITE_APP_VERSION: ${{ github.sha }}
          POSTHOG_UPLOAD_SOURCEMAPS: 'true'
      - name: Upload source maps to PostHog
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::error::Set the POSTHOG_CLI_API_KEY production secret with error tracking write and organization read scopes."
            exit 1
          fi
          pnpm dlx @posthog/cli@0.19.0 sourcemap inject --directory ./dist
          node scripts/validation/commands/check-sourcemaps.mjs dist
          pnpm dlx @posthog/cli@0.19.0 sourcemap upload --directory ./dist --release-name open-keychain --release-version "$GITHUB_SHA"
          find dist -type f -name '*.map' -delete
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source maps must not be included in the deploy artifact."
            exit 1
          fi
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_HOST: https://eu.posthog.com
          POSTHOG_CLI_PROJECT_ID: '251074'
      - uses: ./.github/actions/chromium
      - name: Verify production artifact user journey and exports
        run: pnpm test:e2e:journey
        env:
          PLAYWRIGHT_BASE_URL: ''
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
          VITE_HOSTED_MODE: 'false'
          PLAYWRIGHT_SMOKE: 'false'
          PLAYWRIGHT_DEPLOYMENT: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [quality, production-build]
    if: ${{ !cancelled() && needs.production-build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: netlify-production
      cancel-in-progress: true
    steps:
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Deploy production build
        run: pnpm --package=netlify-cli dlx netlify deploy --prod --no-build --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
