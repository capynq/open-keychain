name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Classify checkout changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/validation/commands/validation-ci-changes.mjs
        env:
          VALIDATION_BASE_SHA: ${{ github.event.before }}
      - name: Install Chromium for selected Browser coverage
        if: steps.changes.outputs.needs_browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run selected checks
        if: github.event_name != 'workflow_dispatch'
        run: pnpm validate:ci:changed
        env:
          CHANGED_FILES_JSON: ${{ steps.changes.outputs.changed_files }}
          VALIDATION_CONCURRENCY: 1
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
      - name: Install Chromium for manual full validation
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run full hosted validation
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm validate:ci
          pnpm validate:ci:browser
          pnpm validate:ci:geometry
        env:
          VALIDATION_CONCURRENCY: 1
          MATRIX_CONCURRENCY: 1
          VALIDATION_UI: plain
          VALIDATION_CACHE: 0
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'

  production-build:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production artifact
        run: pnpm --package=netlify-cli dlx netlify build --context production
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VITE_APP_VERSION: ${{ github.sha }}
          POSTHOG_UPLOAD_SOURCEMAPS: 'true'
      - name: Upload source maps to PostHog
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::error::Set the POSTHOG_CLI_API_KEY production secret with error tracking write and organization read scopes."
            exit 1
          fi
          pnpm dlx @posthog/cli sourcemap inject --directory ./dist
          pnpm dlx @posthog/cli sourcemap upload --directory ./dist --release-name open-keychain --release-version "$GITHUB_SHA"
          find dist -type f -name '*.map' -delete
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source maps must not be included in the deploy artifact."
            exit 1
          fi
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_HOST: https://eu.posthog.com
          POSTHOG_CLI_PROJECT_ID: '251074'
      - name: Install Chromium for production journey
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production artifact user journey and exports
        run: pnpm test:e2e:journey
        env:
          PLAYWRIGHT_BASE_URL: ''
          PLAYWRIGHT_USE_EXISTING_BUILD: 'true'
          VITE_HOSTED_MODE: 'false'
          PLAYWRIGHT_SMOKE: 'false'
          PLAYWRIGHT_DEPLOYMENT: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [quality, production-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: netlify-production
      cancel-in-progress: true
    steps:
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Deploy production build
        run: pnpm --package=netlify-cli dlx netlify deploy --prod --no-build --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
