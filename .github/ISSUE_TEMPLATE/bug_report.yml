name: Bug report
description: Report a reproducible problem
title: 'bug: '
labels:
  - bug
  - triage
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Describe the text, font, style, controls, and browser state that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, screen size, and commit or deployment URL.
    validations:
      required: true
