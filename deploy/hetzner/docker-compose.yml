services:
  open-keychain-api:
    build:
      context: ../..
      dockerfile: deploy/hetzner/Dockerfile.api
    container_name: open-keychain-api
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      ANONYMOUS_WEEKLY_EXPORTS: ${ANONYMOUS_WEEKLY_EXPORTS:-3}
      PAID_DAILY_EXPORTS: ${PAID_DAILY_EXPORTS:-200}
      PAID_MINUTE_EXPORTS: ${PAID_MINUTE_EXPORTS:-6}
    ports:
      - '127.0.0.1:3100:3000'
    depends_on:
      open-keychain-postgres:
        condition: service_healthy

  open-keychain-postgres:
    image: postgres:16-bookworm
    container_name: open-keychain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - open-keychain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  open-keychain-postgres-data:
