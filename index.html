<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="author" content="Open Keychain" />
    <link rel="describedby" href="/llms.txt" type="text/markdown" />
    <!-- route-font-preloads -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Keychain" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        /* Picks the boot frame variant; keep in step with scripts/build/boot-routes.ts. */
        const html = document.documentElement;
        const path = window.location.pathname.replace(/\/+$/, '') || '/';
        const route =
          path === '/' ? 'landing' : path === '/create' ? 'customizer' : path === '/profile' ? 'profile' : 'none';
        html.dataset.bootRoute = route;
        const params = new URLSearchParams(window.location.search);
        const locales = ['en', 'ru', 'uk'];
        const requested = locales.includes(params.get('lang')) ? params.get('lang') : undefined;
        if (route === 'landing') {
          /* `/` is English unless `?lang` asks otherwise (detectInitialLocale). */
          const locale = requested ?? 'en';
          html.lang = locale;
          html.dataset.bootKey = locale;
        } else if (route === 'customizer') {
          /* Like i18next's navigator detector: the first supported language in the list. */
          const browser = [...(navigator.languages?.length ? navigator.languages : [navigator.language])]
            .map((language) => language.toLowerCase().split('-')[0])
            .find((language) => locales.includes(language));
          const locale = requested ?? browser ?? 'en';
          const templates = ['name-keychain', 'articulated-name', 'magnet', 'nameplate', 'plant-label'];
          const template = params.has('design')
            ? 'neutral'
            : templates.includes(params.get('template'))
              ? params.get('template')
              : 'name-keychain';
          html.lang = locale;
          html.dataset.bootKey = `${locale}:${template}`;
        } else if (route === 'profile') {
          html.dataset.bootKey = 'skeleton';
        }
      })();
    </script>
    <!-- route-boot-head -->
    <script>
      (() => {
        const recoveryCopy = {
          en: {
            message: 'Open Keychain could not start. Reload the page to try again.',
            reload: 'Reload',
          },
          ru: {
            message: 'Open Keychain не удалось запустить. Перезагрузите страницу и попробуйте снова.',
            reload: 'Перезагрузить',
          },
          uk: {
            message: 'Open Keychain не вдалося запустити. Перезавантажте сторінку й спробуйте ще раз.',
            reload: 'Перезавантажити',
          },
        };
        let appReady = false;
        let recoveryShown = false;

        const isBeforeAppReady = () => !appReady && document.documentElement.dataset.appReady !== 'true';

        const hideRecovery = () => {
          appReady = true;
          const recovery = document.getElementById('boot-recovery');
          if (recovery) recovery.hidden = true;
        };

        const showRecovery = () => {
          if (!isBeforeAppReady() || recoveryShown) return;
          recoveryShown = true;
          const recovery = document.getElementById('boot-recovery');
          if (!recovery) {
            recoveryShown = false;
            return;
          }
          const pathnameLocale = window.location.pathname.match(/^\/(en|ru|uk)(?:\/|$)/)?.[1];
          const requestedLocale = new URLSearchParams(window.location.search).get('lang');
          const browserLocale = navigator.language.toLowerCase().split('-')[0];
          const locale = ['en', 'ru', 'uk'].includes(pathnameLocale)
            ? pathnameLocale
            : ['en', 'ru', 'uk'].includes(requestedLocale)
              ? requestedLocale
              : ['en', 'ru', 'uk'].includes(browserLocale)
                ? browserLocale
                : 'en';
          const copy = recoveryCopy[locale];
          recovery.querySelector('[data-boot-recovery-message]').textContent = copy.message;
          recovery.querySelector('[data-boot-recovery-reload]').textContent = copy.reload;
          recovery.hidden = false;
        };

        const isAppEntryScript = (target) => {
          if (!(target instanceof HTMLScriptElement) || !target.src) return false;
          const path = new URL(target.src, window.location.href).pathname;
          return /\/(?:assets\/app-[^/]+\.js|src\/main\.tsx)$/.test(path);
        };

        window.addEventListener(
          'error',
          (event) => {
            if (!isBeforeAppReady()) return;
            if (event.target === window || !event.target || isAppEntryScript(event.target)) showRecovery();
          },
          true,
        );
        window.addEventListener('unhandledrejection', () => {
          if (isBeforeAppReady()) showRecovery();
        });
        const readyObserver = new MutationObserver(() => {
          if (document.documentElement.dataset.appReady === 'true') hideRecovery();
        });
        readyObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-app-ready'] });
        window.setTimeout(showRecovery, 12000);
        window.addEventListener(
          'DOMContentLoaded',
          () => {
            const recovery = document.getElementById('boot-recovery');
            recovery
              ?.querySelector('[data-boot-recovery-reload]')
              ?.addEventListener('click', () => window.location.reload());
            if (document.documentElement.dataset.appReady === 'true') hideRecovery();
          },
          { once: true },
        );
      })();
    </script>
    <style>
      #boot-shell {
        position: fixed;
        z-index: 1000;
        inset: 0;
        overflow: hidden;
        background: #f6f4ef;
      }

      #boot-shell[hidden],
      html[data-boot-route='none'] #boot-shell,
      html[data-app-ready='true']:not([data-boot-handoff='pending']) #boot-shell {
        display: none;
      }

      /*
       * The live landing page scrolls. Give the booting page the same auto scrollbar (a gutter
       * would also shrink vw units, which the hero type uses), so the frame lays out at the same
       * width and the hand-off does not shift on classic-scrollbar systems.
       */
      html[data-boot-route='landing']:not([data-app-ready='true']) body {
        min-height: calc(100vh + 1px);
      }

      #boot-recovery[hidden],
      html[data-app-ready='true'] #boot-recovery {
        display: none;
      }

      #boot-recovery {
        position: fixed;
        z-index: 1100;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #303545;
        background: #f6f4ef;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      #boot-recovery .boot-recovery__card {
        width: min(100%, 30rem);
        box-sizing: border-box;
        padding: 24px;
        border: 1px solid #d7c8bd;
        border-radius: 16px;
        background: #fffdf9;
        box-shadow: 0 12px 30px rgb(48 53 69 / 12%);
      }

      #boot-recovery button {
        min-height: 44px;
        margin-top: 16px;
        padding: 8px 18px;
        border: 1px solid #303545;
        border-radius: 999px;
        color: #fffdf9;
        background: #303545;
        font: inherit;
        cursor: pointer;
      }

      #boot-recovery button:hover {
        background: #46506a;
      }

      #boot-recovery button:active {
        background: #222735;
      }

      #boot-recovery button:focus-visible {
        outline: 3px solid #c7654b;
        outline-offset: 3px;
      }

      #boot-no-js {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #303545;
        background: #f6f4ef;
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-recovery button {
          transition: none;
        }
      }
    </style>
    <title>Open Keychain 3D - free printable name keychain maker</title>
  </head>

  <body>
    <noscript>
      <style>
        #boot-shell {
          display: none !important;
        }
      </style>
      <div id="boot-no-js">Open Keychain needs JavaScript enabled to create a keychain.</div>
    </noscript>
    <div id="boot-shell" data-boot-shell aria-hidden="true">
      <div id="boot-frame" aria-hidden="true" inert><!-- route-boot-frames --></div>
      <script>
        (() => {
          /* Shows the server-rendered frame for this route, cloning it unless it is inline. */
          const { bootRoute, bootKey } = document.documentElement.dataset;
          const frame = document.getElementById('boot-frame');
          const wanted = `${bootRoute}:${bootKey}`;
          if (frame.querySelector(`:scope > [data-boot-inline="${wanted}"]`)) {
            frame.querySelectorAll(':scope > template').forEach((template) => template.remove());
            return;
          }
          const template = frame.querySelector(`:scope > template[data-boot-frame="${wanted}"]`);
          frame.replaceChildren(...(template ? [template.content.cloneNode(true)] : []));
        })();
      </script>
    </div>
    <div id="boot-recovery" hidden role="alert" aria-live="assertive">
      <div class="boot-recovery__card">
        <p data-boot-recovery-message>Open Keychain could not start. Reload the page to try again.</p>
        <button type="button" data-boot-recovery-reload>Reload</button>
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
