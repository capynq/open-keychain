<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="author" content="Open Keychain" />
    <link rel="describedby" href="/llms.txt" type="text/markdown" />
    <link rel="preload" href="/fonts/nunito.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/bree-serif.ttf" as="font" type="font/ttf" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Keychain" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/brand/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      const bootPath = window.location.pathname.replace(/\/+$/, '') || '/';
      const bootRoute =
        bootPath === '/'
          ? 'landing'
          : bootPath === '/create'
            ? 'customizer'
            : bootPath === '/profile'
              ? 'profile'
              : 'none';
      document.documentElement.dataset.bootRoute = bootRoute;
      if (bootRoute === 'customizer') {
        const customizerBootStyleUrls = __CUSTOMIZER_BOOT_STYLE_URLS__;
        for (const href of customizerBootStyleUrls) {
          const stylesheet = document.createElement('link');
          stylesheet.rel = 'stylesheet';
          stylesheet.href = href;
          document.head.append(stylesheet);
        }
        const bootParams = new URLSearchParams(window.location.search);
        const bootLanguages = ['en', 'ru', 'uk'];
        const bootTemplates = ['name-keychain', 'articulated-name', 'magnet', 'nameplate', 'plant-label'];
        const bootLanguageParam = bootParams.get('lang');
        const bootBrowserLanguage = navigator.language.toLowerCase().split('-')[0];
        const bootLocale = bootLanguages.includes(bootLanguageParam)
          ? bootLanguageParam
          : bootLanguages.includes(bootBrowserLanguage)
            ? bootBrowserLanguage
            : 'en';
        document.documentElement.lang = bootLocale;
        const bootTemplate = bootParams.has('design')
          ? 'neutral'
          : bootTemplates.includes(bootParams.get('template'))
            ? bootParams.get('template')
            : 'name-keychain';
        document.documentElement.dataset.bootCustomizer = `${bootLocale}:${bootTemplate}`;
      }
    </script>
    <script>
      (() => {
        const recoveryCopy = {
          en: {
            message: 'Open Keychain could not start. Reload the page to try again.',
            reload: 'Reload',
          },
          ru: {
            message: 'Open Keychain не удалось запустить. Перезагрузите страницу и попробуйте снова.',
            reload: 'Перезагрузить',
          },
          uk: {
            message: 'Open Keychain не вдалося запустити. Перезавантажте сторінку й спробуйте ще раз.',
            reload: 'Перезавантажити',
          },
        };
        let appReady = false;
        let recoveryShown = false;

        const isBeforeAppReady = () => !appReady && document.documentElement.dataset.appReady !== 'true';

        const hideRecovery = () => {
          appReady = true;
          const recovery = document.getElementById('boot-recovery');
          if (recovery) recovery.hidden = true;
        };

        const showRecovery = () => {
          if (!isBeforeAppReady() || recoveryShown) return;
          recoveryShown = true;
          const recovery = document.getElementById('boot-recovery');
          if (!recovery) {
            recoveryShown = false;
            return;
          }
          const pathnameLocale = window.location.pathname.match(/^\/(en|ru|uk)(?:\/|$)/)?.[1];
          const requestedLocale = new URLSearchParams(window.location.search).get('lang');
          const browserLocale = navigator.language.toLowerCase().split('-')[0];
          const locale = ['en', 'ru', 'uk'].includes(pathnameLocale)
            ? pathnameLocale
            : ['en', 'ru', 'uk'].includes(requestedLocale)
              ? requestedLocale
              : ['en', 'ru', 'uk'].includes(browserLocale)
                ? browserLocale
                : 'en';
          const copy = recoveryCopy[locale];
          recovery.querySelector('[data-boot-recovery-message]').textContent = copy.message;
          recovery.querySelector('[data-boot-recovery-reload]').textContent = copy.reload;
          recovery.hidden = false;
        };

        const isAppEntryScript = (target) => {
          if (!(target instanceof HTMLScriptElement) || !target.src) return false;
          const path = new URL(target.src, window.location.href).pathname;
          return /\/(?:assets\/app-[^/]+\.js|src\/main\.tsx)$/.test(path);
        };

        window.addEventListener(
          'error',
          (event) => {
            if (!isBeforeAppReady()) return;
            if (event.target === window || !event.target || isAppEntryScript(event.target)) showRecovery();
          },
          true,
        );
        window.addEventListener('unhandledrejection', () => {
          if (isBeforeAppReady()) showRecovery();
        });
        const readyObserver = new MutationObserver(() => {
          if (document.documentElement.dataset.appReady === 'true') hideRecovery();
        });
        readyObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-app-ready'] });
        window.setTimeout(showRecovery, 12000);
        window.addEventListener(
          'DOMContentLoaded',
          () => {
            const recovery = document.getElementById('boot-recovery');
            recovery
              ?.querySelector('[data-boot-recovery-reload]')
              ?.addEventListener('click', () => window.location.reload());
            if (document.documentElement.dataset.appReady === 'true') hideRecovery();
          },
          { once: true },
        );
      })();
    </script>
    <style>
      #boot-shell {
        position: fixed;
        z-index: 1000;
        inset: 0;
        overflow: hidden;
        background: #f6f4ef;
      }

      #boot-shell[hidden],
      html[data-boot-route='none'] #boot-shell,
      html[data-app-ready='true'] #boot-shell {
        display: none;
      }

      #boot-shell [data-route-skeleton] {
        display: none;
      }

      html[data-boot-route='landing'] #boot-shell [data-route-skeleton='landing'],
      html[data-boot-route='profile'] #boot-shell [data-route-skeleton='profile'] {
        display: block;
      }

      #boot-shell .route-skeleton {
        min-height: 100dvh;
        color: #303545;
        background: #f6f4ef;
      }

      #boot-shell .route-skeleton__header {
        display: flex;
        min-height: 62px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 10px clamp(18px, 4vw, 64px);
        border-bottom: 1px solid #dfddd6;
      }

      #boot-shell .route-skeleton__brand,
      #boot-shell .route-skeleton__nav,
      #boot-shell .route-skeleton__action,
      #boot-shell .route-skeleton__line,
      #boot-shell .route-skeleton__control,
      #boot-shell .route-skeleton__button,
      #boot-shell .route-skeleton__showcase {
        display: block;
        border-radius: 8px;
        background: #e8e2d9;
      }

      #boot-shell .route-skeleton__brand {
        width: 172px;
        height: 34px;
      }

      #boot-shell .route-skeleton__nav {
        width: 180px;
        height: 18px;
      }

      #boot-shell .route-skeleton__action {
        width: 116px;
        height: 38px;
        border-radius: 999px;
      }

      #boot-shell .route-skeleton__landing {
        display: grid;
        width: min(100% - 64px, 1320px);
        min-height: min(620px, calc(100dvh - 62px));
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(36px, 5vw, 76px);
        margin-inline: auto;
        padding-block: 48px;
      }

      #boot-shell .route-skeleton__landing-copy,
      #boot-shell .route-skeleton__profile-form {
        display: grid;
        align-content: start;
        gap: 14px;
      }

      #boot-shell .route-skeleton__line--short {
        width: 36%;
        height: 12px;
      }

      #boot-shell .route-skeleton__line--title {
        width: 78%;
        height: clamp(42px, 5vw, 68px);
      }

      #boot-shell .route-skeleton__line--wide {
        width: 92%;
      }

      #boot-shell .route-skeleton__line--body {
        width: 72%;
        height: 14px;
      }

      #boot-shell .route-skeleton__button {
        width: 178px;
        height: 46px;
        border-radius: 999px;
      }

      #boot-shell .route-skeleton__showcase {
        width: 100%;
        aspect-ratio: 16 / 10;
        padding: 12px;
        border: 1px solid #dfddd6;
        border-radius: 20px;
        background: #eee8df;
      }

      #boot-shell .route-skeleton__control {
        height: 42px;
        border: 1px solid #d7c8bd;
        background: #fffdf9;
      }

      #boot-shell .route-skeleton__reference {
        width: min(100% - 48px, 840px);
        margin: clamp(50px, 9vh, 104px) auto;
      }

      #boot-shell .route-skeleton__profile-form {
        width: min(100%, 520px);
        margin-top: 40px;
        padding: 24px;
        border: 1px solid #dfddd6;
        border-radius: 16px;
        background: #fffdf8;
      }

      #boot-recovery[hidden],
      html[data-app-ready='true'] #boot-recovery {
        display: none;
      }

      #boot-recovery {
        position: fixed;
        z-index: 1100;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #303545;
        background: #f6f4ef;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      #boot-recovery .boot-recovery__card {
        width: min(100%, 30rem);
        box-sizing: border-box;
        padding: 24px;
        border: 1px solid #d7c8bd;
        border-radius: 16px;
        background: #fffdf9;
        box-shadow: 0 12px 30px rgb(48 53 69 / 12%);
      }

      #boot-recovery button {
        min-height: 44px;
        margin-top: 16px;
        padding: 8px 18px;
        border: 1px solid #303545;
        border-radius: 999px;
        color: #fffdf9;
        background: #303545;
        font: inherit;
        cursor: pointer;
      }

      #boot-recovery button:hover {
        background: #46506a;
      }

      #boot-recovery button:active {
        background: #222735;
      }

      #boot-recovery button:focus-visible {
        outline: 3px solid #c7654b;
        outline-offset: 3px;
      }

      #boot-no-js {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #303545;
        background: #f6f4ef;
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-recovery button {
          transition: none;
        }
      }

      @media (max-width: 760px) {
        #boot-shell .route-skeleton__nav {
          display: none;
        }

        #boot-shell .route-skeleton__landing {
          display: flex;
          width: min(100% - 36px, 560px);
          flex-direction: column;
          gap: 42px;
          padding-block: 58px;
        }
      }
    </style>
    <title>Open Keychain 3D - free printable name keychain maker</title>
  </head>

  <body>
    <noscript>
      <style>
        #boot-shell {
          display: none !important;
        }
      </style>
      <div id="boot-no-js">Open Keychain needs JavaScript enabled to create a keychain.</div>
    </noscript>
    <div id="boot-shell" data-boot-shell aria-hidden="true">
      <div class="route-skeleton route-skeleton--landing" data-route-skeleton="landing">
        <header class="route-skeleton__header">
          <span class="route-skeleton__brand"></span><span class="route-skeleton__nav"></span
          ><span class="route-skeleton__action"></span>
        </header>
        <main class="route-skeleton__landing">
          <div class="route-skeleton__landing-copy">
            <span class="route-skeleton__line route-skeleton__line--short"></span
            ><span class="route-skeleton__line route-skeleton__line--title"></span
            ><span class="route-skeleton__line route-skeleton__line--title route-skeleton__line--wide"></span
            ><span class="route-skeleton__line route-skeleton__line--body"></span
            ><span class="route-skeleton__line route-skeleton__line--body route-skeleton__line--wide"></span
            ><span class="route-skeleton__button"></span>
          </div>
          <div class="route-skeleton__showcase"></div>
        </main>
      </div>
      <div id="boot-customizer" aria-hidden="true" inert></div>
      <!-- customizer-boot-variants -->
      <script>
        if (document.documentElement.dataset.bootRoute === 'customizer') {
          const bootTemplate = document.querySelector(
            `template[data-customizer-boot="${document.documentElement.dataset.bootCustomizer}"]`,
          );
          if (bootTemplate) document.getElementById('boot-customizer').append(bootTemplate.content.cloneNode(true));
        }
      </script>
      <div class="route-skeleton route-skeleton--profile" data-route-skeleton="profile">
        <header class="route-skeleton__header">
          <span class="route-skeleton__brand"></span><span class="route-skeleton__nav"></span
          ><span class="route-skeleton__action"></span>
        </header>
        <main class="route-skeleton__reference">
          <span class="route-skeleton__line route-skeleton__line--short"></span
          ><span class="route-skeleton__line route-skeleton__line--title"></span>
          <section class="route-skeleton__profile-form">
            <span class="route-skeleton__control"></span><span class="route-skeleton__control"></span
            ><span class="route-skeleton__button"></span>
          </section>
        </main>
      </div>
    </div>
    <div id="boot-recovery" hidden role="alert" aria-live="assertive">
      <div class="boot-recovery__card">
        <p data-boot-recovery-message>Open Keychain could not start. Reload the page to try again.</p>
        <button type="button" data-boot-recovery-reload>Reload</button>
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
